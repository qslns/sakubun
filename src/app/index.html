<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>작문·면접 드릴</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23FAFAFA' font-family='serif'%3E作%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Klee+One:wght@400;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FAFAFA; --ink:#141414; --ink-2:#525252; --ink-3:#6E6E6E; --line:#DCDCDC; --red:#A8342B; --soft:#F0F0F0;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-ja:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-pen:"Klee One","Hiragino Maru Gothic ProN","YuKyokasho","Yu Kyokasho","BIZ UDPGothic",serif;
  --f-num:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Menlo,monospace;
  --top-h:56px; --pad:20px;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#121212; --ink:#EBEBEB; --ink-2:#ABABAB; --ink-3:#8C8C8C; --line:#333333; --red:#E07B6F; --soft:#1E1E1E;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--f-ko);word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:4px}
button,select,input,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;border-radius:0}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.ja{font-family:var(--f-ja);word-break:normal;line-break:strict}
ruby{ruby-position:over}
rt{font-family:var(--f-ja);font-size:.5em;font-weight:400;line-height:1.1;letter-spacing:0;color:var(--ink-3);user-select:none}
body.nofuri rt{visibility:hidden}
body.nofuri ruby.peek rt{visibility:visible;color:var(--ink)}
b,strong{font-weight:600}
h1,h2,h3,p{margin:0}
.small{font-size:14px;line-height:1.65;color:var(--ink-3)}
.eyebrow{margin:0 0 12px;font:500 12.5px/1.4 var(--f-ko);letter-spacing:.06em;color:var(--ink-3)}
.num{font-family:var(--f-num)}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex:none;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding:0 var(--pad);padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-decoration:none;font:600 16px/1 var(--f-ko);white-space:nowrap}
.rtitle{min-width:0;font:500 15px/1.3 var(--f-ko);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sp{flex:1}
.dchip{font:500 12.5px/1 var(--f-num);letter-spacing:.06em;color:var(--ink-3);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;border:0;background:none;cursor:pointer;white-space:nowrap;font:500 14.5px/1 var(--f-ko);color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--line);text-underline-offset:7px}
.tbtn.fz{font-family:var(--f-ja)}
.tbtn[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through}

#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:36px var(--pad) 48px}
.wrap.run{flex:1 0 auto;padding-top:22px;padding-bottom:28px}
h1{font-size:28px;line-height:1.35;font-weight:500;letter-spacing:-.02em}
h2{font-size:21px;line-height:1.45;font-weight:500}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px;margin:44px 0 10px;font:600 14.5px/1.4 var(--f-ko)}
.sec-h .small{font-weight:400}
.lede{margin-top:14px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 16px/1.3 var(--f-ko);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.wide{width:100%;min-height:58px;font-size:16.5px}
.btn.ghost{min-height:44px;padding:0 6px;border-color:transparent;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:6px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ng{border-color:var(--red);color:var(--red)}

.today{padding-bottom:8px}
.today .t-sub{margin:10px 0 24px;color:var(--ink-2)}
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks li{display:flex;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.tasks .tn{flex:none;width:22px;font:500 13px/1 var(--f-num);color:var(--ink-3)}
.tasks .tt{flex:1;min-width:0}
.tasks .ts{flex:none;font-size:14px;color:var(--ink-3);white-space:nowrap}
.tasks li.done .tt{color:var(--ink-3)}
.tasks li.now .tt{font-weight:600}
.tasks.dates .tn{width:44px;white-space:nowrap}
.today .lede.tip{margin:-8px 0 20px}
.meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meter div{padding:12px 4px}
.meter b{display:block;font:500 20px/1.2 var(--f-num)}
.meter span{font-size:13px;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:36px}

.stages{display:flex;gap:0;width:100%;max-width:760px;margin:0 auto;padding:14px var(--pad) 0}
.stages span{flex:1;padding:6px 2px 8px;border-top:2px solid var(--line);font:500 12px/1.3 var(--f-ko);color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages span.on{border-top-color:var(--ink);color:var(--ink)}
.stages span.past{border-top-color:var(--ink-3)}

.inst{margin:0 0 18px;font-size:15px;color:var(--ink-3)}
.ko{font-size:21px;line-height:1.6;font-weight:500;text-wrap:pretty}
.ko.sub{margin-top:10px;font-size:16.5px;font-weight:400;color:var(--ink-2)}
.jbig{font-family:var(--f-ja);font-size:27px;line-height:2.15;word-break:normal;line-break:strict}
.jmid{font-family:var(--f-ja);font-size:22px;line-height:2.1;word-break:normal;line-break:strict}
.pen{font-family:var(--f-pen)}
.sent{padding:16px 0;border-bottom:1px solid var(--line)}
.sent:first-of-type{border-top:1px solid var(--line)}
.sent .role{display:block;margin-bottom:2px;font:500 12px/1.4 var(--f-ko);letter-spacing:.06em;color:var(--ink-3)}
.sent .row{display:flex;align-items:flex-start;gap:12px}
.sent .row .jmid{flex:1;min-width:0}
.sent .kr{margin-top:2px;font-size:15.5px;color:var(--ink-2)}
.play{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;margin-top:6px;border:1px solid var(--line);background:none;cursor:pointer;font-size:15px;line-height:1}
.play.txt{width:auto;padding:0 14px;font:500 14.5px/1 var(--f-ko)}
.qbox{margin:0 0 20px;padding:14px 16px;background:var(--soft)}
.qbox .jmid{font-size:20px}
.blank{display:inline-block;min-width:3.2em;margin:0 .15em;border-bottom:2px solid var(--ink);text-align:center;line-height:1.5}
.blank.fill{border-bottom-color:transparent;font-weight:700}
.blank.fill.bad{color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}
.opt{min-height:64px;padding:6px 12px;border:1px solid var(--line);background:none;cursor:pointer;font-family:var(--f-ja);font-size:21px;line-height:1.9}
.opt.ok{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt.ok rt{color:var(--bg)}
.opt.bad{border-color:var(--red);color:var(--red)}
.opt.dim{opacity:.45}
.fb{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.mark{display:inline-block;margin-right:10px;font:600 15px/1 var(--f-ko)}
.mark.bad{color:var(--red)}
.built{display:flex;flex-wrap:wrap;gap:8px;min-height:74px;margin:20px 0 14px;padding:10px;border:1px dashed var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:64px}
.chip{min-height:54px;padding:2px 14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-family:var(--f-ja);font-size:20px;line-height:2}
.built .chip{border-color:var(--ink)}
.hint{margin-top:14px;font-size:15px;color:var(--ink-3)}
.reveal{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.kana{margin-top:2px;font-family:var(--f-ja);font-size:15px;color:var(--ink-3)}

.glyph{font-family:var(--f-pen);font-size:84px;line-height:1.25;font-weight:400}
.gread{font-family:var(--f-ja);font-size:20px;color:var(--ink-2)}
.kvg{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.kvg figure{margin:0;width:168px}
.kvg svg{display:block;width:168px;height:168px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.kvg path{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.kvg path.off{stroke:var(--line)}
.kvg text{font:500 7px var(--f-num);fill:var(--red)}
.kvg line{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2}
.kvg figcaption{margin-top:4px;font-size:12.5px;color:var(--ink-3);text-align:center}
.cover{display:flex;align-items:center;justify-content:center;height:150px;border:1px dashed var(--line);color:var(--ink-3);font-size:15px}

.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}
.pk{min-height:56px;padding:8px 12px;border:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:400 16px/1.4 var(--f-ko)}
.pk[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pk.must{outline:2px solid var(--ink);outline-offset:-5px}
.timer{font:500 68px/1.1 var(--f-num);letter-spacing:-.02em}
.essay{margin-top:18px;padding:16px;background:var(--soft)}
.essay p{font-family:var(--f-ja);font-size:19px;line-height:2.2;text-indent:1em;word-break:normal;line-break:strict}
.essay .xs{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.plan3{margin:14px 0 0;padding:0;list-style:none;font-size:15.5px;color:var(--ink-2)}
.plan3 li{padding:3px 0}
.checks{margin:16px 0 0;padding:0;list-style:none}
.checks li{padding:6px 0;font-size:16px}

.list{border-top:1px solid var(--line)}
.rowl{display:flex;align-items:baseline;gap:12px;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;text-decoration:none;cursor:pointer}
.rowl .tt{flex:1;min-width:0}
.rowl .ts{flex:none;font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.rowl .wj{font-family:var(--f-pen);font-size:22px}
.set{border-top:1px solid var(--line)}
.set > div{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 2px;border-bottom:1px solid var(--line)}
.set .sl{flex:1;min-width:180px}
.set textarea{width:100%;min-height:84px;padding:8px;border:1px solid var(--line);background:var(--bg);font:13px/1.5 var(--f-num)}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{min-height:44px;padding:0 14px;border:0;background:none;cursor:pointer;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.chk{color:var(--red)}
.voc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.voc .vl{margin-right:2px;font:500 12px/1 var(--f-ko);letter-spacing:.04em;color:var(--ink-3)}
.vc{min-height:36px;padding:0 10px;border:1px solid var(--line);background:none;cursor:pointer;font-family:var(--f-ja);font-size:15px;line-height:1;color:var(--ink-2)}
.vc[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.voc .vd{flex-basis:100%;font-size:15px;color:var(--ink-2)}
.voc .vd:empty{display:none}
.meter.m5{grid-template-columns:repeat(5,minmax(0,1fr))}
.meter a{text-decoration-color:var(--line)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.qc{display:flex;align-items:center;justify-content:center;height:46px;border:1px solid var(--ink-3);font:500 14px/1 var(--f-num);text-decoration:none;color:var(--ink)}
.qc.sub{font-size:13.5px}
.qc.core{font-weight:700;border-width:2px}
.qc.main{font-weight:700;border-width:2px}
.chain{padding:16px 0 8px;border-top:1px solid var(--line)}
.chh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.chh b{font:600 16px/1.45 var(--f-ko)}
.chh .chgo{margin-left:auto;padding:7px 12px;font-size:13.5px;min-height:0}
.chain .qgrid{margin-top:10px}
.qc.ok{background:var(--ink);border:1px solid var(--ink);color:var(--bg)}
.qc.ng{border:2px solid var(--red);color:var(--red)}
.qlist{margin-top:6px}
.qlist summary{display:flex;align-items:center;min-height:44px;cursor:pointer}
.rowl.sub .tt{padding-left:16px;color:var(--ink-2)}
.fx{display:block;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.fx .fxm{display:block;margin-bottom:2px;font:600 12.5px/1.4 var(--f-ko);color:var(--ink-3)}
.fx .fxk{display:block;font-size:17px;font-weight:500;line-height:1.6}
.fx .fxj{display:block;font-size:15px;line-height:2;color:var(--ink-2)}
.fx[aria-pressed="true"] .fxm{color:var(--red)}
.fx[aria-pressed="true"] .fxk{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}

.bar{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line)}
.bar-in{display:flex;gap:10px;max-width:760px;margin:0 auto;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{flex:1;min-height:60px;font-size:17px}
.bar .btn.narrow{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:96px;z-index:50;transform:translateX(-50%);padding:10px 16px;background:var(--ink);color:var(--bg);font-size:14.5px;white-space:nowrap}
@media (max-width:560px){
  body{font-size:16px}
  h1{font-size:24px}
  .jbig{font-size:23px}
  .jmid{font-size:20px}
  .opts,.pick{grid-template-columns:minmax(0,1fr)}
  .meter,.meter.m5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .timer{font-size:54px}
}
</style>
</head>
<body>
<div id="app"><p style="padding:40px 20px;color:#6E6E6E">여는 중…</p></div>

</body>
</html>
